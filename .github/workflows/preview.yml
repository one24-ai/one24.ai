name: PR preview

# Builds each pull request and publishes it to https://preview.one24.ai
# by force-pushing the built site to the one24-ai/one24-preview repo,
# which serves it with GitHub Pages. Only one PR is previewed at a time:
# the most recently updated PR wins.
#
# Setup (one time):
#   - Repo one24-ai/one24-preview, Pages: deploy from branch `main`, root,
#     custom domain preview.one24.ai
#   - DNS: CNAME preview -> one24-ai.github.io
#   - Secret PREVIEW_DEPLOY_TOKEN in this repo: fine-grained token with
#     Contents: read and write on one24-ai/one24-preview only

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview
  cancel-in-progress: true

env:
  PREVIEW_REPO: one24-ai/one24-preview
  PREVIEW_DOMAIN: preview.one24.ai

jobs:
  preview:
    # Secrets aren't available to PRs from forks, so only preview our own branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; the comment is the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same build as production, plus a noindex tag so search engines skip the preview.
      - run: pnpm build
        env:
          PUBLIC_PREVIEW: "true"

      - name: Add preview-only files
        run: |
          echo "$PREVIEW_DOMAIN" > dist/CNAME
          touch dist/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Publish to the preview repo
        env:
          TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PREVIEW_DEPLOY_TOKEN secret is not set"
            exit 1
          fi
          cd dist
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview of PR #$PR ($SHA)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${PREVIEW_REPO}.git" main

      - name: Comment the preview link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- pr-preview -->"
          body="$marker
          **Preview:** https://$PREVIEW_DOMAIN (built from \`${SHA:0:7}\`; can take a minute or two to go live)

          Only the most recently updated PR is shown at that address."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
